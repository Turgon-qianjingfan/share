name: test

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: python scripts/run_v3_demo.py
      - run: python scripts/run_v3_2_lb_regression.py
      - run: python scripts/run_v3_3_lb_regression.py
      - run: python scripts/run_v3_3_lb_expanded_regression.py
      - run: python run_backtest.py --demo
